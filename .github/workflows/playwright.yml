name: Playwright UI Automation

on:
  push:
    branches:
      - main

  pull_request:
    branches:
    - main
  

permissions:
  contents: read

concurrency:
  group: playwright-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: UI cases (QA / Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      TARGET_ENV: qa
      BASE_URL: ${{ vars.BASE_URL || 'https://www.saucedemo.com' }}
      CI: true

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install Chromium and OS dependencies
        run: npx playwright install --with-deps chromium

      - name: Execute all 15 automated cases through the custom runner
        run: npm test -- --suite all --env qa --browser chromium

      # Generate failure details even when Playwright tests fail.
      - name: Generate Markdown failure summary
        if: always()
        run: |
          node scripts/create-failure-summary.mjs
          cat failure-summary.md >> "$GITHUB_STEP_SUMMARY"

      # Keep the existing interactive HTML report.
      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-html-report
          path: playwright-report/
          retention-days: 30
          if-no-files-found: warn

      # Upload machine-readable results and debugging evidence.
      - name: Upload JSON results and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-diagnostics
          path: |
            failure-summary.md
            test-results/
          retention-days: 14
          if-no-files-found: warn